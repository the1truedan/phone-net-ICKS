<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- I.N-D.O.C.-T.R.I.N. 8-P.I.E.C.E. app icon: a feeder scanner, a receipt going through, a light-line scan, µ at the center -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1330"/>
      <stop offset=".55" stop-color="#151a44"/>
      <stop offset="1" stop-color="#062a35"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".52" r=".5">
      <stop offset="0" stop-color="#7cf3ff" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#8a5cff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3566"/>
      <stop offset="1" stop-color="#161c3c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ff2ff"/>
      <stop offset=".5" stop-color="#a98bff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe8f5"/>
    </linearGradient>
    <linearGradient id="mu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fe9ff"/>
      <stop offset=".6" stop-color="#8c6bff"/>
      <stop offset="1" stop-color="#ff6fd0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="squircle"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
  </defs>

  <!-- macOS rounded-square tile -->
  <g clip-path="url(#squircle)">
    <rect x="64" y="64" width="896" height="896" fill="url(#bg)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#glow)"/>
    <!-- faint circuit grid -->
    <g stroke="#7cf3ff" stroke-opacity=".07" stroke-width="3" fill="none">
      <path d="M64 250H960M64 410H960M64 770H960M250 64V960M774 64V960"/>
    </g>
    <g fill="#7cf3ff" fill-opacity=".16">
      <circle cx="250" cy="250" r="7"/><circle cx="774" cy="250" r="7"/><circle cx="250" cy="770" r="7"/><circle cx="774" cy="770" r="7"/>
    </g>
  </g>

  <!-- receipt going in at the top (behind the scanner) -->
  <g filter="url(#shadow)">
    <path d="M372 150 H652 V420 H372 Z" fill="url(#paper)"/>
    <path d="M372 150 L372.0 150 L395.3 130 L418.7 150 L442.0 130 L465.3 150 L488.7 130 L512.0 150 L535.3 130 L558.7 150 L582.0 130 L605.3 150 L628.7 130 L652.0 150 Z" fill="url(#paper)"/>
    <g fill="#9aa9c4">
      <rect x="402" y="192" width="150" height="14" rx="7"/>
      <rect x="402" y="226" width="96" height="12" rx="6"/><rect x="560" y="226" width="62" height="12" rx="6"/>
      <rect x="402" y="256" width="120" height="12" rx="6"/><rect x="560" y="256" width="62" height="12" rx="6"/>
    </g>
  </g>

  <!-- scanner body -->
  <g filter="url(#shadow)">
    <rect x="196" y="330" width="632" height="388" rx="96" fill="url(#body)"/>
    <rect x="196" y="330" width="632" height="388" rx="96" fill="none" stroke="url(#edge)" stroke-width="10" stroke-opacity=".9"/>
    <!-- feeder slot -->
    <rect x="330" y="356" width="364" height="22" rx="11" fill="#070b1f"/>
  </g>

  <!-- µ in the center, glowing -->
  <text x="512" y="640" text-anchor="middle" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Helvetica Neue, Arial, sans-serif"
        font-weight="800" font-size="270" fill="url(#mu)" filter="url(#soft)" opacity=".75">µ</text>
  <text x="512" y="640" text-anchor="middle" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Helvetica Neue, Arial, sans-serif"
        font-weight="800" font-size="270" fill="url(#mu)">µ</text>

  <!-- scan line of light across the body -->
  <rect x="250" y="398" width="524" height="12" rx="6" fill="#7cf3ff" filter="url(#soft)" opacity=".9"/>
  <rect x="250" y="401" width="524" height="6" rx="3" fill="#e9fdff"/>

  <!-- receipt coming out at the bottom, read: ticks and a total line -->
  <g filter="url(#shadow)">
    <path d="M372 690 H652 V842 L628.7 862 L605.3 842 L582.0 862 L558.7 842 L535.3 862 L512.0 842 L488.7 862 L465.3 842 L442.0 862 L418.7 842 L395.3 862 L372.0 842 Z" fill="url(#paper)"/>
    <g fill="none" stroke="#2bc58a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M402 748 l12 12 l22 -24"/>
      <path d="M402 790 l12 12 l22 -24"/>
    </g>
    <rect x="462" y="742" width="90" height="12" rx="6" fill="#9aa9c4"/>
    <rect x="462" y="784" width="90" height="12" rx="6" fill="#9aa9c4"/>
    <rect x="574" y="742" width="50" height="12" rx="6" fill="#8c6bff"/>
    <rect x="574" y="784" width="50" height="12" rx="6" fill="#8c6bff"/>
  </g>
</svg>
