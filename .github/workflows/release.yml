name: Desktop release (Mac, Windows, Linux)
# Runs when a version tag (v*) is pushed. Builds the PUBLIC desktop app (no admin pages: sync_pages.sh without ADMIN=1),
# unsigned, on GitHub's runners, then publishes the installers and SHA256SUMS.txt on the release for that tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  TAURI_CLI_VERSION: 3.0.0-alpha.5
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple silicon
          - os: windows-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Tauri CLI
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI_VERSION }} --locked
      - name: Public pages only (no admin build)
        shell: bash
        working-directory: desktop
        run: |
          ./sync_pages.sh
          test ! -f ui/admin.json
      - name: Build
        working-directory: desktop
        run: cargo tauri build
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find desktop/src-tauri/target/release/bundle \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            ! -name 'ADMIN-ONLY*' -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        id: notes
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md
          echo "title=$(grep -m1 '^## ' CHANGELOG.md | sed -E 's/^## +//; s/ — [0-9-]+ · / · /')" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: dist/*
