<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">The alert gap</title>
  <desc id="d">A timesheet leaves a caregiver's phone and reaches the agency. Two alerts go back: a text that dies at a carrier email-to-text gateway that has been shut off, and a secure email that opens blank. The shift sits at "ready", unpaid. Then a working path: an in-app alert reaches the phone with "received" and a reason if it stalls.</desc>
  <style>
    .bg { fill: #fbfaf7; } .ink { fill: #1d1c1a; } .line { stroke: #1d1c1a; }
    .muted { fill: #5d5a54; } .card { fill: #fff; stroke: #1d1c1a; stroke-width: 3; }
    .red { fill: #c8231b; } .redS { stroke: #c8231b; } .green { fill: #11804a; } .greenS { stroke: #11804a; }
    text { font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, sans-serif; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .cap { font-weight: 800; letter-spacing: .06em; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161614; } .ink { fill: #ecebe6; } .line { stroke: #ecebe6; } .muted { fill: #a9a59c; }
      .card { fill: #201f1c; stroke: #ecebe6; } .red { fill: #ff5a4e; } .redS { stroke: #ff5a4e; } .green { fill: #3ad28a; } .greenS { stroke: #3ad28a; }
    }
    /* 12 s loop */
    .sheet  { animation: sheet 12s ease-in-out infinite; }
    .sms    { animation: sms 12s ease-in infinite; }
    .blank  { animation: blank 12s ease-in-out infinite; }
    .stuck  { animation: stuck 12s steps(1) infinite; }
    .boom   { animation: boom 12s ease-out infinite; transform-origin: 600px 118px; transform-box: view-box; }
    .fix    { animation: fix 12s ease-in-out infinite; }
    .ok     { animation: ok 12s steps(1) infinite; }
    .dash   { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    @keyframes sheet { 0%{transform:translate(0,0);opacity:0} 4%{opacity:1} 18%{transform:translate(520px,0);opacity:1} 22%,100%{transform:translate(520px,0);opacity:0} }
    @keyframes sms   { 0%,22%{transform:translate(0,0);opacity:0} 24%{opacity:1} 34%{transform:translate(-140px,0);opacity:1} 38%{transform:translate(-150px,60px) rotate(25deg);opacity:0} 100%{opacity:0} }
    @keyframes boom  { 0%,33%{opacity:0;transform:scale(.6)} 35%{opacity:1;transform:scale(1.15)} 40%,58%{opacity:1;transform:scale(1)} 62%,100%{opacity:0} }
    @keyframes blank { 0%,40%{transform:translate(0,0);opacity:0} 42%{opacity:1} 54%{transform:translate(-520px,0);opacity:1} 60%{transform:translate(-520px,0);opacity:1} 63%,100%{opacity:0} }
    @keyframes stuck { 0%,45%{opacity:0} 46%,48%{opacity:1} 49%,51%{opacity:.25} 52%,64%{opacity:1} 65%,100%{opacity:0} }
    @keyframes fix   { 0%,66%{transform:translate(0,0);opacity:0} 68%{opacity:1} 82%{transform:translate(-520px,0);opacity:1} 84%,100%{opacity:0} }
    @keyframes ok    { 0%,82%{opacity:0} 83%,98%{opacity:1} 99%,100%{opacity:0} }
    @keyframes flow  { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) {
      .sheet,.sms,.blank,.fix,.boom,.dash { animation: none; }
      .sheet,.sms,.blank,.fix { opacity: 0; }
      .stuck { animation: none; opacity: 1; } .ok { animation: none; opacity: 0; }
      .boom { opacity: 1; }
    }
  </style>

  <rect class="bg" width="960" height="400"/>

  <!-- heading -->
  <text class="ink cap" x="40" y="54" font-size="30">THE ALERT GAP</text>
  <text class="muted" x="40" y="82" font-size="16">The timesheet goes in. The alert that should come back never arrives.</text>

  <!-- caregiver phone -->
  <g>
    <rect class="card" x="60" y="118" width="120" height="210" rx="18"/>
    <rect class="line" x="98" y="130" width="44" height="6" rx="3" fill="none" stroke-width="2"/>
    <text class="ink cap" x="120" y="352" font-size="14" text-anchor="middle">CAREGIVER</text>
    <!-- stuck status -->
    <g class="stuck">
      <rect class="red" x="72" y="196" width="96" height="64" rx="8"/>
      <text x="120" y="220" font-size="11.5" fill="#fff" text-anchor="middle" class="cap">READY FOR</text>
      <text x="120" y="236" font-size="11.5" fill="#fff" text-anchor="middle" class="cap">TIME</text>
      <text x="120" y="252" font-size="11.5" fill="#fff" text-anchor="middle" class="cap">TRACKING</text>
    </g>
    <!-- fixed status -->
    <g class="ok" opacity="0">
      <rect class="green" x="72" y="196" width="96" height="64" rx="8"/>
      <path d="M100 228 l12 12 l26 -28" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- agency -->
  <g>
    <rect class="card" x="780" y="130" width="140" height="180" rx="6"/>
    <path class="line" d="M780 130 l70 -34 l70 34" fill="none" stroke-width="3"/>
    <g class="line" stroke-width="3"><path d="M810 160 v120 M850 160 v120 M890 160 v120"/></g>
    <text class="ink cap" x="850" y="352" font-size="14" text-anchor="middle">AGENCY</text>
  </g>

  <!-- the wire between them -->
  <path class="line dash" d="M184 224 H776" fill="none" stroke-width="2" opacity=".5"/>

  <!-- carrier gateway, shut off -->
  <g>
    <path class="line" d="M600 118 l-22 88 h44 z M584 160 h32 M590 140 h20" fill="none" stroke-width="3"/>
    <text class="muted mono" x="600" y="104" font-size="12" text-anchor="middle">number@carrier gateway</text>
    <g class="boom">
      <circle class="red" cx="600" cy="150" r="30" opacity=".18"/>
      <path class="redS" d="M584 134 l32 32 M616 134 l-32 32" stroke-width="7" stroke-linecap="round"/>
      <text class="red cap" x="600" y="236" font-size="13" text-anchor="middle" dy="0">SHUT OFF</text>
      <text class="red mono" x="600" y="252" font-size="11" text-anchor="middle">6/17/2025</text>
    </g>
  </g>

  <!-- 1. timesheet travels right -->
  <g class="sheet">
    <rect class="card" x="196" y="196" width="46" height="58" rx="3"/>
    <g class="line" stroke-width="3"><path d="M205 212 h28 M205 224 h28 M205 236 h18"/></g>
  </g>

  <!-- 2. text alert travels left and dies at the gateway -->
  <g class="sms" opacity="0">
    <rect class="card" x="720" y="120" width="70" height="40" rx="10"/>
    <text class="ink cap" x="755" y="145" font-size="13" text-anchor="middle">SMS</text>
  </g>

  <!-- 3. secure email travels left and arrives blank -->
  <g class="blank" opacity="0">
    <rect class="card" x="716" y="270" width="72" height="50" rx="4"/>
    <path class="line" d="M716 270 l36 26 l36 -26" fill="none" stroke-width="3"/>
    <text class="muted cap" x="752" y="340" font-size="11" text-anchor="middle">BLANK</text>
  </g>

  <!-- 4. the fix: an in-app alert -->
  <g class="fix" opacity="0">
    <rect class="green" x="706" y="200" width="92" height="46" rx="12"/>
    <text x="752" y="221" font-size="12" fill="#fff" text-anchor="middle" class="cap">RECEIVED</text>
    <text x="752" y="237" font-size="10.5" fill="#fff" text-anchor="middle">or why it stalled</text>
  </g>

  <text class="muted" x="40" y="388" font-size="13">Paper sign-up · 2–4 weeks to activate · texts through shut-off gateways · secure mail that opens blank</text>
</svg>
