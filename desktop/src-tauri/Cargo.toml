[package]
name = "phone-net-icks"
version = "0.8.0"
description = "phone-net-ICKS desktop: THE LAST JUDGEMENT"
authors = ["the1truedan"]
license = "MIT"
repository = "https://github.com/the1truedan/phone-net-ICKS"
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "3.0.0-alpha.5", features = [] }
tauri-runtime-wry = { version = "3.0.0-alpha.5" }
tauri-plugin-log = "3.0.0-alpha.1"
ureq = { version = "=3.4.2", features = ["json"] }
