# phone-net I.C.K.S. — one local stack (reference, v0.3.0). Nothing here reaches the internet except model downloads.
# Requires: Docker 24+, docker compose v2; NVIDIA driver + nvidia-container-toolkit on the GPU host.
# Data never goes in the image: mount your evidence folder at ./evidence (read-only for originals).
name: icks

services:
  ollama:                       # local LLM summaries + embeddings (gemma, nomic-embed)
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama-models:/root/.ollama"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  asr:                          # WhisperX + pyannote worker (transcribe, align, speakers)
    build: { context: ., dockerfile: Dockerfile.asr }
    environment:
      HF_TOKEN_FILE: /run/secrets/hf_token      # accept pyannote/speaker-diarization-community-1 terms first
      ICKS_GPU_GATE_MIB: "6000"
      ICKS_PAUSE_FILE: /work/PAUSE
    secrets: [hf_token]
    volumes:
      - ./evidence:/evidence:ro
      - ./work:/work
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  tools:                        # intake + custody + OCR: adb, ffmpeg, rclone, tesseract, scrcpy (CLI only)
    build: { context: ., dockerfile: Dockerfile.tools }
    volumes:
      - ./evidence:/evidence
      - ./work:/work
      - /dev/bus/usb:/dev/bus/usb               # USB-C phone access for adb (Linux host)
    privileged: false
    device_cgroup_rules: ["c 189:* rmw"]

secrets:
  hf_token: { file: ./secrets/hf_token.txt }    # git-ignored

volumes:
  ollama-models: {}
  hf-cache: {}
